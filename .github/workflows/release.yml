name: Release
# tag 触发：三平台矩阵（windows-amd64 / linux-amd64 / macos-arm64）构建 GUI + sidecar
# GUI（go build gui/，ldflags 注入 main.version）+ sidecar（git clone callacat/x-tunnel @ feat/route-engine 后 go build ./cmd/x-tunnel）
# 每平台打包 zip（GUI+sidecar+README+默认规则）上传 artifact → 汇总 job 生成总 SHA256SUMS → GitHub Release
# 版本单源：tag（vX.Y.Z）→ XTUNNEL_WIN_VERSION_NAME 注入 GUI version.ldflags。
# Linux 端 GUI 是 Wails v3，需 CGO + gtk4/webkitgtk-6.0/libsoup-3.0 开发库，构建前 apt 安装。
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.2.0"
        required: true

permissions:
  contents: write

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"
  CORE_REPO: callacat/x-tunnel
  CORE_REF: feat/route-engine

jobs:
  build:
    strategy:
      fail-fast: false # 单平台失败不取消其余平台，各自产出 artifact
      matrix:
        include:
          - platform: windows-amd64
            runner: windows-latest
            gui_name: x-tunnel-windows.exe
            sidecar_name: x-tunnel.exe
            # -H windowsgui：PE 子系统设为 GUI，双击启动不弹 CMD 黑框（东哥 09-04 反馈①）
            gui_ldflags_extra: "-H windowsgui"
          - platform: linux-amd64
            runner: ubuntu-24.04
            gui_name: x-tunnel-windows
            sidecar_name: x-tunnel
          - platform: macos-arm64
            runner: macos-latest
            gui_name: x-tunnel-windows
            sidecar_name: x-tunnel
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Checkout GUI repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          TAG="${RELEASE_TAG}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.2.3: ${TAG}" >&2
            exit 1
          fi
          echo "XTUNNEL_WIN_VERSION_NAME=${TAG#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: gui/frontend/package-lock.json

      # Wails v3 Linux 端依赖 GTK4 + webkitgtk-6.0 + libsoup3 开发库
      # 必须用 ubuntu-24.04：webkitgtk-6.0.pc（GTK4 同代 WebKitGTK）仅 24.04+
      # 提供（包名 libwebkitgtk-6.0-dev）；22.04 只有 4.x 包（libwebkit2gtk-4.1-dev）
      - name: Install Linux GUI dependencies (Wails v3)
        if: matrix.platform == 'linux-amd64'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev libsoup-3.0-dev

      # 前端构建三平台都要（GUI go:embed frontend/dist），放矩阵内每平台跑一次，简单可靠
      - name: Generate Wails bindings
        working-directory: gui
        shell: bash
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-alpha2.119
          "$(go env GOPATH)/bin/wails3" generate bindings -clean --ts -d frontend/bindings
          ls frontend/bindings/github.com/callacat/x-tunnel-windows/gui/ || true

      - name: Build frontend
        working-directory: gui/frontend
        run: |
          npm ci
          npm test -- --run || true
          npm run build

      # Windows PE 版本资源随 tag 注入（versioninfo.json 里 0.0.0.0 仅模板兜底）：
      # 生成的 resource_windows_amd64.syso 与 main package 同目录，go build 自动链接，
      # exe 文件属性（FileVersion/ProductVersion）与 zip 文件名、GUI 首页显示三处同源。
      # 必须在 Build GUI binary 之前——syso 要参与链接，构建完再生成无效。
      - name: Generate Windows PE version resource (goversioninfo)
        if: matrix.platform == 'windows-amd64'
        working-directory: gui
        shell: bash # windows runner 默认 pwsh，不支持 <<< here-string
        env:
          VERSION: ${{ env.XTUNNEL_WIN_VERSION_NAME }}
        run: |
          NUM="${VERSION%%-*}"
          go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 -64 \
            -ver-major "$(cut -d. -f1 <<<"${NUM}")" \
            -ver-minor "$(cut -d. -f2 <<<"${NUM}")" \
            -ver-patch "$(cut -d. -f3 <<<"${NUM}")" \
            -file-version "${NUM}.0" -product-version "${NUM}.0" \
            -o resource_windows_amd64.syso versioninfo.json

      # GUI 构建命令三平台统一：-C gui 后 -o ../dist/ 相对 gui/ 落到仓库根 dist/
      # CGO_ENABLED=1：Wails v3 在 linux/macos 需要 cgo，windows 无 cgo 导入不受影响
      - name: Build GUI binary
        shell: bash # windows runner 默认 pwsh，${VERSION} 会被展开为空
        env:
          CGO_ENABLED: "1"
          VERSION: ${{ env.XTUNNEL_WIN_VERSION_NAME }}
        run: |
          go build -C gui -trimpath -ldflags "-s -w -X main.version=${VERSION} ${{ matrix.gui_ldflags_extra }}" -o ../dist/${{ matrix.gui_name }} .

      - name: Build sidecar x-tunnel
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ env.CORE_REF }}" "https://github.com/${{ env.CORE_REPO }}.git" external/x-tunnel
          go build -C external/x-tunnel -trimpath -ldflags "-s -w" -o "${{ github.workspace }}/dist/${{ matrix.sidecar_name }}" ./cmd/x-tunnel

      - name: Package zip (Windows)
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: |
          $tag = "$env:RELEASE_TAG"
          # sidecar 放 config/ 子目录（东哥 09-04 反馈②）：GUI 同级 config/x-tunnel.exe
          New-Item -ItemType Directory -Force -Path dist/config | Out-Null
          Move-Item dist/x-tunnel.exe dist/config/x-tunnel.exe -Force
          Copy-Item scripts/README-dist.md dist/README.md
          Copy-Item scripts/default-rules.txt dist/config/rules.txt
          Compress-Archive -Path dist/x-tunnel-windows.exe, dist/config, dist/README.md -DestinationPath "dist/x-tunnel-windows-${tag}-windows-amd64.zip" -Force
          Get-ChildItem dist | Format-Table Name, Length

      # Linux/macOS 用 python3 -m zipfile 打包（ubuntu 自带 python3、macOS 自带，避免装 zip）
      # 结构与 Windows 对齐（东哥 09-04 反馈②）：sidecar 收运行目录 config/ 下，
      # 与 GUI 查找路径 execDir()/config/ 一致（service.go newSidecarManager）。
      - name: Package zip (Linux/macOS)
        if: matrix.platform != 'windows-amd64'
        shell: bash
        run: |
          cp scripts/README-dist.md dist/README.md
          mkdir -p dist/config
          mv dist/x-tunnel dist/config/x-tunnel
          cp scripts/default-rules.txt dist/config/rules.txt
          cd dist
          python3 -m zipfile -c "x-tunnel-windows-${RELEASE_TAG}-${{ matrix.platform }}.zip" x-tunnel-windows config README.md
          ls -la

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-tunnel-${{ matrix.platform }}
          path: dist/x-tunnel-windows-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download all platform zips
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd release-assets
          sha256sum *.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            release-assets/*.zip
            release-assets/SHA256SUMS
          generate_release_notes: true
